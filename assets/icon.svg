<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3242"/>
      <stop offset="1" stop-color="#141925"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d62e12"/>
      <stop offset="0.55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffc23e"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#ffe97a"/>
    </linearGradient>
    <linearGradient id="scorch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8541f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c8541f" stop-opacity="0"/>
    </linearGradient>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="docClip">
      <rect x="76" y="42" width="104" height="116" rx="10"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 规范文档 -->
  <g filter="url(#docShadow)">
    <rect x="76" y="42" width="104" height="116" rx="10" fill="#f8f6f1"/>
  </g>
  <g clip-path="url(#docClip)">
    <!-- 底部焦色：被火烤过 -->
    <rect x="76" y="108" width="104" height="50" fill="url(#scorch)"/>
  </g>

  <!-- checklist -->
  <rect x="90" y="56" width="74" height="8" rx="4" fill="#d9d3c7"/>
  <!-- 已完成 x2 -->
  <rect x="90" y="76" width="14" height="14" rx="3" fill="#e05a2f"/>
  <path d="M93 83 l3 3 l5 -6" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="79.5" width="52" height="7" rx="3.5" fill="#c9c3b6"/>
  <rect x="90" y="98" width="14" height="14" rx="3" fill="#e05a2f"/>
  <path d="M93 105 l3 3 l5 -6" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="101.5" width="52" height="7" rx="3.5" fill="#c9c3b6"/>
  <!-- 待办 -->
  <rect x="90" y="120" width="14" height="14" rx="3" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <rect x="112" y="123.5" width="52" height="7" rx="3.5" fill="#c9c3b6"/>
  <!-- 最后一条：正被火焰舔到 -->
  <rect x="90" y="142" width="76" height="7" rx="3.5" fill="#c9c3b6"/>

  <!-- 火焰：中央主焰（舔到文档最末行） -->
  <path fill="url(#flameOuter)" d="M128 208
    C110 208 100 196 102 182
    C103 174 108 168 106 158
    C116 164 118 172 118 176
    C118 164 122 152 128 140
    C134 152 138 164 138 176
    C138 172 140 164 150 158
    C148 168 153 174 154 182
    C156 196 146 208 128 208 Z"/>
  <!-- 内焰 -->
  <path fill="url(#flameInner)" d="M128 204
    C118 204 112 196 114 186
    C115 180 119 176 118 170
    C124 174 126 180 126 184
    C126 176 128 168 128 158
    C128 168 130 176 130 184
    C130 180 132 174 138 170
    C137 176 141 180 142 186
    C144 196 138 204 128 204 Z"/>
  <!-- 左右侧焰 -->
  <path fill="url(#flameOuter)" d="M86 204 C76 198 74 186 80 174 C79 182 84 184 85 178 C89 186 90 196 86 204 Z"/>
  <path fill="url(#flameOuter)" d="M170 204 C180 198 182 186 176 174 C177 182 172 184 171 178 C167 186 166 196 170 204 Z"/>

  <!-- 烤架格栅：压在火焰前面 -->
  <rect x="62" y="176" width="132" height="6" rx="3" fill="#97a0b0"/>
  <rect x="62" y="192" width="132" height="6" rx="3" fill="#828d9f"/>

  <!-- 火星 -->
  <circle cx="98" cy="118" r="3.5" fill="#ffc23e"/>
  <circle cx="160" cy="106" r="3" fill="#ffc23e"/>
  <circle cx="146" cy="92" r="2.5" fill="#ff9a3e"/>
</svg>
